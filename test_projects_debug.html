<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Projects JavaScript</title>
</head>
<body>
    <h1>Test Projects JavaScript</h1>
    
    <button id="test-linkedin" data-id="linkedin-scraper">Test LinkedIn Scraper Button</button>
    <div id="output"></div>
    
    <script type="module">
        // Test if the projects configuration is working
        const PROJECTS = {
            'linkedin-scraper': {
                tabs: ['Overview', 'Code'],
                defaultTab: 'Overview',
                script: 'assets/py/linkedin_credentials_scrape.py'
            }
        };
        
        document.getElementById('test-linkedin').addEventListener('click', () => {
            const output = document.getElementById('output');
            output.innerHTML = `
                <h3>Testing LinkedIn Scraper Project</h3>
                <p>Button clicked!</p>
                <p>Project config: ${JSON.stringify(PROJECTS['linkedin-scraper'], null, 2)}</p>
                <p>Data ID: ${document.getElementById('test-linkedin').dataset.id}</p>
            `;
        });
        
        // Test if project viewer elements exist on main page
        fetch('projects.html')
            .then(response => response.text())
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                const linkedinButton = doc.querySelector('[data-id="linkedin-scraper"]');
                const linkedinDetails = doc.querySelector('[data-project="linkedin-scraper"]');
                
                console.log('LinkedIn button found:', !!linkedinButton);
                console.log('LinkedIn details found:', !!linkedinDetails);
                
                if (linkedinButton) {
                    console.log('Button HTML:', linkedinButton.outerHTML);
                }
                if (linkedinDetails) {
                    console.log('Details found:', linkedinDetails.className);
                }
            });
    </script>
</body>
</html>
